<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETF量化大师 (手机版)</title>
  <script>
    (function() {
      var loc = window.location;
      var path = loc.pathname;
      if (path.indexOf('/mobile') !== -1) return;
      var base = path;
      if (base.endsWith('index.html')) {
        base = base.substring(0, base.length - 'index.html'.length);
      }
      if (!base.endsWith('/')) {
        base += '/';
      }
      var target = base + 'mobile/index.html';
      loc.replace(loc.origin + target + loc.search + loc.hash);
    })();
  </script>
</head>
<body style="background:#0f172a; color:#fff; font-family:sans-serif; text-align:center; padding-top:40px;">
  <p>正在进入 ETF量化大师 (手机版)...</p>
  <p><a id="jumpLink" href="mobile/index.html" style="color:#3b82f6;">点击直接进入</a></p>
  <script>
    (function() {
      var loc = window.location;
      var path = loc.pathname;
      var base = path;
      if (base.endsWith('index.html')) {
        base = base.substring(0, base.length - 'index.html'.length);
      }
      if (!base.endsWith('/')) {
        base += '/';
      }
      document.getElementById('jumpLink').href = loc.origin + base + 'mobile/index.html';
    })();
  </script>
</body>
</html>
